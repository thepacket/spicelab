name: Reject pull requests

# This repository does not accept pull requests. Every one is closed
# automatically, with a comment explaining why and where to raise the issue
# instead.
#
# `pull_request_target` rather than `pull_request`: a workflow triggered by
# `pull_request` from a fork gets a read-only token and cannot close anything.
# `pull_request_target` runs in the context of the BASE repository, so it has
# the write permission this needs.
#
# It never checks out or executes the contributor's branch — that is the whole
# risk of `pull_request_target`, and this workflow avoids it by not doing it.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body: [
                "This repository does not accept pull requests, so this one has",
                "been closed automatically. Nothing is wrong with your change.",
                "",
                "SpiceLab is a single-author project and its correctness rests on",
                "a validation discipline described in `CLAUDE.md` — a JS reference",
                "oracle, golden fixtures, an analytic suite, and differential",
                "testing against ngspice. Reviewing outside contributions against",
                "that standard is not something this project has the capacity to",
                "do properly, and merging them without it would undermine the one",
                "thing that makes the results trustworthy.",
                "",
                "**Please open an issue instead.** Bug reports are genuinely",
                "welcome, especially ones with a netlist that reproduces the",
                "problem — a wrong number with a circuit attached is worth far",
                "more here than a patch.",
                "",
                "The licence is GPL-3.0-or-later, so you are free to fork and",
                "take the project wherever you like.",
              ].join("\n"),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: n,
              state: "closed",
            });
